[build]
  command = "npm run build"
  publish = "dist"

# A function runtime rögzítése a 2026-09-12-i állapotra (nodejs24.x), Morpheus msg 267.
[build.environment]
  AWS_LAMBDA_JS_RUNTIME = "nodejs24.x"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
